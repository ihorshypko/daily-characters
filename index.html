<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Daily Characters"><link rel="manifest" href="manifest.webmanifest"><title>Daily Characters</title><style>
:root{--t:#3d3d3d;--d:#283136;--l:#e9e9e9;--sh:0 5px 18px #0002}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#fff;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif}body{min-height:100vh;min-height:100dvh}button{font:inherit}.app{width:100%;max-width:620px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 6px}.brand{font-weight:850;font-size:18px}.tools{display:flex;gap:6px}.tools button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:800}.nav{display:flex;gap:6px;overflow-x:auto;padding:7px 1px 11px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:0;background:#f2f2f2;color:#666;border-radius:18px;padding:7px 11px;font-size:10px;font-weight:800;white-space:nowrap}.nav .on{background:#30383c;color:#fff}.hero{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center;margin:10px 0 7px}.portrait{width:105px;height:105px;object-fit:contain}.titleline{display:flex;gap:8px;align-items:center}.title{font-size:28px;font-weight:850;letter-spacing:-1.5px}.reward{font-size:12px;color:#aaa;white-space:nowrap}.tag{font-size:9px;margin-top:7px;line-height:1.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 25px}.act{min-height:61px;border:1px solid #eee;border-radius:12px;background:#fff;box-shadow:var(--sh);display:grid;grid-template-columns:31px 1fr 28px;align-items:center;text-align:left;padding:6px}.ai{text-align:center;font-size:17px}.at{font-weight:800;font-size:9px}.ad{font-size:6.5px;color:#666;line-height:1.15;margin-top:2px}.plus{height:49px;border-radius:8px;background:linear-gradient(90deg,#263136,#6e7a7f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px}.plus small{font-size:7px;font-weight:500}.prog{margin:0 8px 27px}.picon{text-align:right;font-size:17px;height:18px}.bar{height:10px;border-radius:10px;background:#ddd;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#263136,#7d888c);border-radius:10px;transition:.2s}.meta{display:flex;justify-content:space-between;font-size:7px;margin-top:3px}.monthrow{text-align:center;margin-bottom:12px}.monthrow h2{font-size:18px;margin:0;font-weight:850}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.entry{height:39px;display:grid;grid-template-columns:50px 1fr 28px;align-items:center;overflow:hidden;background:#fff;border-radius:10px;box-shadow:var(--sh)}.date{height:100%;display:flex;align-items:center;padding-left:10px;background:linear-gradient(90deg,#263136,#6e7a7f);color:#fff;font-size:9px;font-weight:800}.ei{text-align:center;font-size:16px}.ep{font-size:10px;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:28px;font-size:12px}.hint{text-align:center;color:#aaa;font-size:9px;margin-top:12px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:end;padding:14px;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:min(560px,100%);margin:auto;border-radius:18px;padding:18px}.sheet h3{margin:0 0 7px}.sheet p{font-size:12px;color:#666}.sheet button{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.del{background:#30383c;color:#fff}.cancel{margin-left:7px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;background:#30383c;color:#fff;padding:10px 15px;border-radius:20px;font-size:11px;transition:.2s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.install{font-size:9px;color:#999;text-align:center;margin:20px 0 0}@media(max-width:370px){.hero{grid-template-columns:88px 1fr}.portrait{width:88px;height:88px}.title{font-size:24px}.history{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><div class="brand">Daily Characters</div><div class="tools"><button id="export">Backup</button><button id="import">Restore</button><input id="file" type="file" accept="application/json" hidden></div></div><div class="nav" id="nav"></div><main id="screen"></main></div><div class="modal" id="modal"><div class="sheet"><h3>Delete entry?</h3><p id="modalText"></p><button class="del" id="delete">Delete</button><button class="cancel" id="cancel">Cancel</button></div></div><div class="toast" id="toast"></div><script>
const SEED=SEED_DATA;const KEY="daily-character-tracker-pwa-v2";let data=load(),current=localStorage.getItem(KEY+"-current")||"samurai",pending=null;function clone(x){return JSON.parse(JSON.stringify(x))}function normalize(c){c.trophies=c.trophies||0;c.progress=Number(c.progress)||0;if(c.totalPoints==null)c.totalPoints=c.trophies*100+c.progress;return c}function load(){try{const x=localStorage.getItem(KEY);if(x)return JSON.parse(x).map(normalize)}catch(e){}return clone(SEED).map(normalize)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function date(x){return x.slice(8,10)+"."+x.slice(5,7)}function C(){return data.find(x=>x.id===current)}function A(c,id){return c.actions.find(x=>x[0]===id)}function nav(){document.querySelector("#nav").innerHTML=data.map(c=>`<button class="${c.id===current?"on":""}" data-id="${c.id}">${c.name}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{current=b.dataset.id;localStorage.setItem(KEY+"-current",current);render();scrollTo(0,0)})}function render(){nav();const c=C(),es=[...c.history].sort((a,b)=>b[0].localeCompare(a[0]));document.querySelector("#screen").innerHTML=`<section class="hero"><img class="portrait" src="${c.portrait}"><div><div class="titleline"><div class="title">${c.name}</div><div class="reward">${c.reward} ×${c.trophies||0}</div></div><div class="tag">${c.tagline}</div></div></section><section class="actions">${c.actions.map(a=>`<button class="act" data-a="${a[0]}"><span class="ai">${a[1]}</span><span><div class="at">${a[2]}</div><div class="ad">${a[3]}</div></span><span class="plus">+1<small>Level</small></span></button>`).join("")}</section><section class="prog"><div class="picon">${c.reward}</div><div class="bar"><div class="fill" style="width:${Math.min(c.progress,100)}%"></div></div><div class="meta"><span>0</span><span>${c.progress}</span><span>100</span></div></section><div class="monthrow"><h2>History</h2></div><section class="history">${es.length?es.map(e=>{const a=A(c,e[1]);return `<div class="entry" data-id="${e[3]||""}"><div class="date">${date(e[0])}</div><div class="ei">${a?.[1]||"•"}</div><div class="ep">+${e[2]}</div></div>`}).join(""):`<div class="empty">No actions yet.</div>`}</section><div class="hint">Tap an entry from today to remove it. Older entries are locked.</div></div>`;document.querySelectorAll(".act").forEach(b=>b.onclick=()=>add(b.dataset.a));document.querySelectorAll(".entry").forEach(e=>e.onclick=()=>ask(e.dataset.id))}function add(id){const c=C(),entryId=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();c.history.push([today(),id,1,entryId]);c.totalPoints=(c.totalPoints||0)+1;c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;save();render();toast(c.progress===0?"Mastery reached — "+c.reward+" +1":A(c,id)[2]+" +1")}function ask(id){const c=C(),i=c.history.findIndex(e=>e[3]===id);if(i<0)return;const e=c.history[i];if(e[0]!==today()){toast("Older entries cannot be deleted.");return}pending=id;document.querySelector("#modalText").textContent=`Remove ${A(c,e[1])?.[2]||"this action"} from today?`;document.querySelector("#modal").classList.add("show")}cancel.onclick=()=>{pending=null;modal.classList.remove("show")};delete.onclick=()=>{if(!pending)return;const c=C(),i=c.history.findIndex(e=>e[3]===pending);if(i<0)return;const e=c.history[i];if(e[0]!==today()){toast("Older entries cannot be deleted.");modal.classList.remove("show");return}c.history.splice(i,1);c.totalPoints=Math.max(0,(c.totalPoints||0)-e[2]);c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;pending=null;modal.classList.remove("show");save();render();toast("Entry removed")};export.onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="daily-characters-backup.json";a.click()};import.onclick=()=>file.click();file.onchange=e=>{const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result).map(normalize);save();current=data[0]?.id||"samurai";render();toast("Backup restored")}catch(_){toast("Invalid backup")}};r.readAsText(e.target.files[0])};function toast(t){const x=document.querySelector("#toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1700)}if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();
</script></body></html>
