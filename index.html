<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Daily Characters</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#fff;color:#30383c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:620px;margin:auto;padding:12px 10px 30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:19px}.tools button,.nav button{border:0;border-radius:12px;padding:8px 10px;font-weight:800;background:#eee}.tools{display:flex;gap:5px}.nav{display:flex;gap:6px;overflow:auto;padding:12px 0}.nav button{white-space:nowrap;color:#666}.nav .on{background:#30383c;color:#fff}.hero{display:flex;gap:14px;align-items:center;margin:10px 0 18px}.portrait{width:105px;height:105px;border-radius:20px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:48px}.title{font-size:28px;font-weight:900}.reward{font-size:12px;color:#999;margin-top:4px}.tag{font-size:12px;line-height:1.4;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.act{min-height:70px;border:1px solid #eee;border-radius:14px;background:#fff;box-shadow:0 4px 16px #0002;text-align:left;padding:8px;display:grid;grid-template-columns:32px 1fr 35px;align-items:center}.ai{text-align:center;font-size:20px}.at{font-size:11px;font-weight:900}.ad{font-size:8px;color:#777;margin-top:3px;line-height:1.2}.plus{height:52px;border-radius:10px;background:#30383c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}.prog{margin:22px 8px 28px}.bar{height:11px;background:#ddd;border-radius:10px;overflow:hidden}.fill{height:100%;background:#30383c;border-radius:10px}.meta{display:flex;justify-content:space-between;font-size:8px;margin-top:4px;color:#777}.historyTitle{text-align:center;font-size:19px;font-weight:900;margin-bottom:12px}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.entry{height:42px;display:grid;grid-template-columns:52px 1fr 30px;align-items:center;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px #0002;background:#fff}.date{height:100%;display:flex;align-items:center;padding-left:9px;background:#30383c;color:#fff;font-size:9px;font-weight:900}.ei{text-align:center}.ep{font-size:10px;font-weight:900}.hint{text-align:center;color:#aaa;font-size:9px;margin-top:12px}.empty{text-align:center;color:#aaa;padding:25px;grid-column:1/-1}@media(max-width:380px){.actions{grid-template-columns:1fr}.history{grid-template-columns:1fr}.hero{gap:10px}.portrait{width:88px;height:88px}.title{font-size:24px}}</style></head><body><div class="app"><div class="top"><div class="brand">Daily Characters</div><div class="tools"><button id="export">Backup</button><button id="import">Restore</button><input id="file" type="file" accept="application/json" hidden></div></div><div class="nav" id="nav"></div><main id="screen"></main></div><script src="seed.js?v=4"></script><script>const KEY='daily-character-tracker-pwa-v4';let data=[],current='samurai';function norm(c){c.trophies=Number(c.trophies||0);c.progress=Number(c.progress||0);c.totalPoints=c.totalPoints==null?c.trophies*100+c.progress:Number(c.totalPoints);c.history=Array.isArray(c.history)?c.history:[];return c}function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s).map(norm)}catch(e){}return JSON.parse(JSON.stringify(window.SEED||[])).map(norm)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function today(){const d=new Date();return d.toISOString().slice(0,10)}function md(x){return x.slice(8,10)+'.'+x.slice(5,7)}function C(){return data.find(c=>c.id===current)||data[0]}function A(c,id){return c.actions.find(a=>a[0]===id)}function renderNav(){const n=document.querySelector('#nav');n.innerHTML=data.map(c=>'<button class="'+(c.id===current?'on':'')+'" data-id="'+c.id+'">'+c.name+'</button>').join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()})}function render(){if(!data.length){document.querySelector('#screen').innerHTML='<div class="empty">No character data loaded.</div>';return}renderNav();const c=C();const h=[...c.history].sort((a,b)=>String(b[0]).localeCompare(String(a[0])));document.querySelector('#screen').innerHTML='<section class="hero"><div class="portrait">'+c.reward+'</div><div><div class="title">'+c.name+'</div><div class="reward">'+c.reward+' × '+c.trophies+'</div><div class="tag">'+c.tagline+'</div></div></section><section class="actions">'+c.actions.map(a=>'<button class="act" data-a="'+a[0]+'"><span class="ai">'+a[1]+'</span><span><div class="at">'+a[2]+'</div><div class="ad">'+a[3]+'</div></span><span class="plus">+1</span></button>').join('')+'</section><section class="prog"><div class="bar"><div class="fill" style="width:'+Math.min(100,c.progress)+'%"></div></div><div class="meta"><span>0</span><span>'+c.progress+'</span><span>100</span></div></section><div class="historyTitle">History</div><section class="history">'+(h.length?h.map(e=>{const a=A(c,e[1]);return '<div class="entry" data-id="'+(e[3]||'')+'" data-date="'+e[0]+'"><div class="date">'+md(e[0])+'</div><div class="ei">'+(a?a[1]:'•')+'</div><div class="ep">+'+e[2]+'</div></div>'}).join(''):'<div class="empty">No actions yet.</div>')+'</section><div class="hint">Today’s entries can be removed. Older entries are locked.</div>';document.querySelectorAll('.act').forEach(b=>b.onclick=()=>add(b.dataset.a));document.querySelectorAll('.entry').forEach(e=>e.onclick=()=>remove(e.dataset.id,e.dataset.date))}function add(id){const c=C();const eid=Date.now()+'-'+Math.random();c.history.push([today(),id,1,eid]);c.totalPoints++;c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;save();render()}function remove(id,date){if(date!==today()){alert('Older entries cannot be deleted.');return}const c=C();const i=c.history.findIndex(e=>e[3]===id);if(i<0){alert('This older entry is locked.');return}c.history.splice(i,1);c.totalPoints=Math.max(0,c.totalPoints-1);c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;save();render()}document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='daily-characters-backup.json';a.click()};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result).map(norm);save();current=data[0].id;render()}catch(x){alert('Invalid backup')}};r.readAsText(e.target.files[0])};data=load();current=localStorage.getItem(KEY+'-current')||data[0]?.id||'samurai';render()</script></body></html>
