<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Daily Characters"><link rel="manifest" href="manifest.webmanifest"><title>Daily Characters</title><style>:root{--d:#30383c;--l:#e9e9e9;--sh:0 5px 18px #0002}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff;color:#3d3d3d;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif}.app{max-width:620px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:18px}.tools{display:flex;gap:5px}.tools button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:7px 8px;font-size:9px;font-weight:800}.nav{display:flex;gap:6px;overflow:auto;padding:9px 1px}.nav button{border:0;background:#f2f2f2;color:#666;border-radius:18px;padding:7px 11px;font-size:10px;font-weight:800;white-space:nowrap}.nav .on{background:var(--d);color:#fff}.hero{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center;margin:10px 0}.portrait{width:105px;height:105px;display:flex;align-items:center;justify-content:center;font-size:58px}.portrait img{width:100%;height:100%;object-fit:contain}.titleline{display:flex;gap:7px;align-items:center}.title{font-size:28px;font-weight:850;letter-spacing:-1.5px}.reward{font-size:11px;color:#aaa;white-space:nowrap}.tag{font-size:9px;line-height:1.35;margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:25px}.act{min-height:61px;border:1px solid #eee;border-radius:12px;background:#fff;box-shadow:var(--sh);display:grid;grid-template-columns:30px 1fr 28px;align-items:center;text-align:left;padding:6px}.ai{text-align:center;font-size:17px}.at{font-weight:800;font-size:9px}.ad{font-size:6.5px;color:#666;line-height:1.15}.plus{height:49px;border-radius:8px;background:linear-gradient(90deg,#263136,#6e7a7f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px}.plus small{font-size:7px;font-weight:500}.prog{margin:0 8px 27px}.picon{text-align:right;font-size:17px;height:18px}.bar{height:10px;border-radius:10px;background:#ddd;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#263136,#7d888c);border-radius:10px}.meta{display:flex;justify-content:space-between;font-size:7px;margin-top:3px}.monthrow{text-align:center;margin-bottom:12px}.monthrow h2{font-size:18px;margin:0}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.entry{height:39px;display:grid;grid-template-columns:50px 1fr 28px;align-items:center;overflow:hidden;background:#fff;border-radius:10px;box-shadow:var(--sh)}.date{height:100%;display:flex;align-items:center;padding-left:10px;background:linear-gradient(90deg,#263136,#6e7a7f);color:#fff;font-size:9px;font-weight:800}.ei{text-align:center;font-size:16px}.ep{font-size:10px;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:28px;font-size:12px}.hint{text-align:center;color:#aaa;font-size:9px;margin-top:12px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:end;padding:14px;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:min(560px,100%);margin:auto;border-radius:18px;padding:18px}.sheet h3{margin:0 0 7px}.sheet p{font-size:12px;color:#666}.sheet button{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.del{background:var(--d);color:#fff}.cancel{margin-left:7px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;background:var(--d);color:#fff;padding:10px 15px;border-radius:20px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:370px){.hero{grid-template-columns:88px 1fr}.portrait{width:88px;height:88px;font-size:48px}.title{font-size:24px}.history{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div class="brand">Daily Characters</div><div class="tools"><button id="export">Backup</button><button id="import">Restore</button><input id="file" type="file" accept="application/json" hidden></div></div><div class="nav" id="nav"></div><main id="screen"></main></div><div class="modal" id="modal"><div class="sheet"><h3>Delete entry?</h3><p id="modalText"></p><button class="del" id="deleteBtn">Delete</button><button class="cancel" id="cancelBtn">Cancel</button></div></div><div class="toast" id="toast"></div><script src="seed.js"></script><script>const KEY="daily-character-tracker-pwa-v2";let data=load(),current=localStorage.getItem(KEY+"-current")||"samurai",pending=null;function norm(c){c.trophies=c.trophies||0;c.progress=+c.progress||0;c.totalPoints=c.totalPoints==null?c.trophies*100+c.progress:c.totalPoints;return c}function load(){try{let x=localStorage.getItem(KEY);if(x)return JSON.parse(x).map(norm)}catch(e){}return JSON.parse(JSON.stringify(window.SEED)).map(norm)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function md(x){return x.slice(8,10)+"."+x.slice(5,7)}function C(){return data.find(x=>x.id===current)}function A(c,id){return c.actions.find(x=>x[0]===id)}function nav(){document.querySelector("#nav").innerHTML=data.map(c=>`<button class="${c.id===current?'on':''}" data-id="${c.id}">${c.name}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{current=b.dataset.id;localStorage.setItem(KEY+"-current",current);render();scrollTo(0,0)})}function render(){nav();let c=C(),h=[...c.history].sort((a,b)=>b[0].localeCompare(a[0]));document.querySelector("#screen").innerHTML=`<section class="hero"><div class="portrait">${c.portrait?`<img src="${c.portrait}" alt="${c.name}">`:`<span>${c.reward}</span>`}</div><div><div class="titleline"><div class="title">${c.name}</div><div class="reward">${c.reward} ×${c.trophies}</div></div><div class="tag">${c.tagline}</div></div></section><section class="actions">${c.actions.map(a=>`<button class="act" data-a="${a[0]}"><span class="ai">${a[1]}</span><span><div class="at">${a[2]}</div><div class="ad">${a[3]}</div></span><span class="plus">+1<small>Level</small></span></button>`).join("")}</section><section class="prog"><div class="picon">${c.reward}</div><div class="bar"><div class="fill" style="width:${Math.min(c.progress,100)}%"></div></div><div class="meta"><span>0</span><span>${c.progress}</span><span>100</span></div></section><div class="monthrow"><h2>History</h2></div><section class="history">${h.length?h.map(e=>{let a=A(c,e[1]);return `<div class="entry" data-id="${e[3]||''}"><div class="date">${md(e[0])}</div><div class="ei">${a?.[1]||'•'}</div><div class="ep">+${e[2]}</div></div>`}).join(""):`<div class="empty">No actions yet.</div>`}</section><div class="hint">Tap an entry from today to remove it. Older entries are locked.</div>`;document.querySelectorAll(".act").forEach(b=>b.onclick=()=>add(b.dataset.a));document.querySelectorAll(".entry").forEach(e=>e.onclick=()=>ask(e.dataset.id))}function add(id){let c=C(),eid=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();c.history.push([today(),id,1,eid]);c.totalPoints++;c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;save();render();toast(c.progress?'+'+A(c,id)[2]:"Mastery reached — "+c.reward+" +1")}function ask(id){let c=C(),i=c.history.findIndex(e=>e[3]===id);if(i<0)return;let e=c.history[i];if(e[0]!==today()){toast("Older entries cannot be deleted.");return}pending=id;document.querySelector("#modalText").textContent="Remove this action from today?";document.querySelector("#modal").classList.add("show")}document.querySelector("#cancelBtn").onclick=()=>{pending=null;document.querySelector("#modal").classList.remove("show")};document.querySelector("#deleteBtn").onclick=()=>{let c=C(),i=c.history.findIndex(e=>e[3]===pending);if(i<0)return;let e=c.history[i];if(e[0]!==today()){toast("Older entries cannot be deleted.");document.querySelector("#modal").classList.remove("show");return}c.history.splice(i,1);c.totalPoints=Math.max(0,c.totalPoints-1);c.trophies=Math.floor(c.totalPoints/100);c.progress=c.totalPoints%100;pending=null;document.querySelector("#modal").classList.remove("show");save();render();toast("Entry removed")};document.querySelector("#export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="daily-characters-backup.json";a.click()};document.querySelector("#import").onclick=()=>document.querySelector("#file").click();document.querySelector("#file").onchange=e=>{let r=new FileReader;r.onload=()=>{try{data=JSON.parse(r.result).map(norm);save();current=data[0].id;render();toast("Backup restored")}catch(_){toast("Invalid backup")}};r.readAsText(e.target.files[0])};function toast(t){let x=document.querySelector("#toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1700)}if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();</script></body></html>
